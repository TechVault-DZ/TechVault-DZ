        // ============ Analytics (GoatCounter) ============
        // ضع هنا اسم حسابك في goatcounter.com (الجزء الذي قبل .goatcounter.com)
        const GC_CODE = 'techvault';
        const GC_ON = GC_CODE !== 'YOUR_CODE' && GC_CODE !== '';
        const GC_BASE = `https://${GC_CODE}.goatcounter.com`;
        // عدّاد التحميلات المعروض (Abacus - مجاني بدون تسجيل)
        const AB_BASE = 'https://abacus.jasoncameron.dev';
        const AB_NS = 'techvault-dz-github-io';
        const dlCounts = {};

        if (GC_ON) {
            const gc = document.createElement('script');
            gc.async = true;
            gc.src = '//gc.zgo.at/count.js';
            gc.setAttribute('data-goatcounter', GC_BASE + '/count');
            document.head.appendChild(gc);
        }

        // المسار يجب أن يبدأ بشرطة مائلة (حسب وثائق GoatCounter)
        function fetchCount(path) {
            return fetch(`${GC_BASE}/counter/${encodeURIComponent(path)}.json`)
                .then(r => r.ok ? r.json() : Promise.reject())
                .then(d => d.count)
                .catch(() => null);
        }

        function applyCounts() {
            document.querySelectorAll('[data-dl]').forEach(el => {
                const v = dlCounts[el.dataset.dl];
                el.textContent = v == null ? '0' : v;
            });
        }

        function loadCounts() {
            if (!GC_ON) return;
            // عدّاد الزوار: زيادة مرة واحدة لكل متصفح، وبعدها قراءة فقط
            let seen = false;
            try { seen = !!localStorage.getItem('tv-visited'); } catch (e) { seen = true; }
            fetch(`${AB_BASE}/${seen ? 'get' : 'hit'}/${AB_NS}/visitors`)
                .then(r => r.ok ? r.json() : { value: 0 })
                .then(d => {
                    document.getElementById('visitorCount').textContent = d.value;
                    if (!seen) { try { localStorage.setItem('tv-visited', '1'); } catch (e) {} }
                })
                .catch(() => { document.getElementById('visitorCount').textContent = '0'; });
            products.forEach(p => {
                fetch(`${AB_BASE}/get/${AB_NS}/download-${p.id}`)
                    .then(r => r.ok ? r.json() : { value: 0 })   // 404 = لم يُحمَّل بعد
                    .then(d => { dlCounts[p.id] = String(d.value); applyCounts(); })
                    .catch(() => {});
            });
        }

        function trackDownload(id) {
            // لوحة GoatCounter (للإحصاءات فقط)
            if (GC_ON && window.goatcounter && window.goatcounter.count) {
                window.goatcounter.count({ path: 'download-' + id, title: 'Download ' + id, event: true });
            }
            // العدّاد المعروض في الصفحة: مرة واحدة لكل متصفح لكل تطبيق
            const k = 'dl-counted-' + id;
            try { if (localStorage.getItem(k)) return; } catch (e) {}
            fetch(`${AB_BASE}/hit/${AB_NS}/download-${id}`)
                .then(r => r.json())
                .then(d => {
                    dlCounts[id] = String(d.value);
                    applyCounts();
                    try { localStorage.setItem(k, '1'); } catch (e) {}
                })
                .catch(() => {});
        }

        let currentLang = 'ar';
        let currentCategory = 'all';

        function changeLanguage(lang) {
            currentLang = lang;
            const html = document.getElementById('htmlRoot');
            html.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
            html.setAttribute('lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });
            filterProducts();
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = "fa-solid fa-moon text-xs sm:text-sm text-gray-600";
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = "fa-solid fa-sun text-xs sm:text-sm text-yellow-400";
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = "fa-solid fa-sun text-xs sm:text-sm text-yellow-400";
        }

        function setCategory(cat) {
            currentCategory = cat;
            ['all', 'desktop', 'android'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (c === cat) {
                    btn.className = "px-5 py-2 rounded-xl text-sm font-semibold bg-emerald-600 text-white shadow-md shadow-emerald-600/20 transition";
                } else {
                    btn.className = "px-5 py-2 rounded-xl text-sm font-semibold bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition";
                }
            });
            filterProducts();
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesCat = currentCategory === 'all' || p.category === currentCategory;
                const name = (p.name[currentLang] || p.name['ar'] || '').toLowerCase();
                const desc = (p.desc[currentLang] || p.desc['ar'] || '').toLowerCase();
                return matchesCat && (name.includes(query) || desc.includes(query));
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">لا توجد نتائج مطابقة لبحثك.</div>`;
                return;
            }

            filtered.forEach(p => {
                const name = escapeHtml(p.name[currentLang] || p.name['ar']);
                const desc = escapeHtml(p.desc[currentLang] || p.desc['ar']);
                const t = translations[currentLang];
                const downloadUrl = p.download_url && p.download_url.trim() !== "" ? p.download_url : "#";
                const hasShots = Array.isArray(p.screenshots) && p.screenshots.length > 0;

                const iconOrImage = p.image
                    ? `<img src="${p.image}" alt="${name}" class="w-14 h-14 rounded-2xl object-cover shadow-md group-hover:scale-105 transition-transform">`
                    : `<div class="w-14 h-14 rounded-2xl bg-gradient-to-tr ${p.color} flex items-center justify-center text-white text-2xl shadow-md group-hover:scale-105 transition-transform"><i class="${p.icon}"></i></div>`;

                const shotsBtn = hasShots ? `
                    <button onclick="openGallery(${p.id})" class="w-full bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-images"></i>
                        <span>${t.screenshots} (${p.screenshots.length})</span>
                    </button>` : '';

                grid.innerHTML += `
                    <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-3xl p-6 shadow-sm hover:shadow-md transition flex flex-col justify-between group">
                        <div>
                            <div class="flex items-start justify-between gap-4 mb-4">
                                <div class="flex items-center gap-3">
                                    ${iconOrImage}
                                    <div>
                                        <h3 class="font-bold text-lg">${name}</h3>
                                        <span class="text-xs px-2.5 py-0.5 rounded-full font-semibold ${p.category === 'desktop' ? 'bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300' : 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300'}">${p.category.toUpperCase()}</span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1 text-amber-500 font-bold text-sm">
                                    <i class="fa-solid fa-star text-xs"></i>
                                    <span>${p.rating}</span>
                                </div>
                            </div>
                            <p class="text-gray-600 dark:text-gray-300 text-sm mb-6">${desc}</p>
                        </div>
                        <div class="space-y-3">
                            <div class="flex items-center justify-between text-xs text-gray-500 dark:text-gray-400 pt-3 border-t border-gray-100 dark:border-gray-700">
                                <span>${t.version}: <strong class="text-gray-700 dark:text-gray-200">${p.version}</strong></span>
                                <span>${t.size}: <strong class="text-gray-700 dark:text-gray-200">${p.size}</strong></span>
                                <span title="${t.downloads}"><i class="fa-solid fa-download"></i> <strong class="text-gray-700 dark:text-gray-200" data-dl="${p.id}">0</strong></span>
                            </div>
                            ${shotsBtn}
                            <a href="${downloadUrl}" target="_blank" rel="noopener" onclick="trackDownload(${p.id})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-600/20 text-sm">
                                <i class="fa-solid fa-download"></i>
                                <span>${t.download}</span>
                            </a>
                        </div>
                    </div>
                `;
            });
            applyCounts();
        }

        // ============ Gallery Logic ============
        function openGallery(productId) {
            const p = products.find(x => x.id === productId);
            if (!p || !Array.isArray(p.screenshots) || p.screenshots.length === 0) return;
            const modal = document.getElementById('galleryModal');
            const main = document.getElementById('galleryMainImg');
            const thumbs = document.getElementById('galleryThumbs');
            main.src = p.screenshots[0];
            thumbs.innerHTML = '';
            p.screenshots.forEach((ss, i) => {
                const img = document.createElement('img');
                img.src = ss;
                img.className = "w-16 h-16 rounded-lg object-cover cursor-pointer border-2 flex-shrink-0 transition " + (i === 0 ? "border-emerald-500" : "border-transparent hover:border-emerald-300");
                img.onclick = () => {
                    main.src = ss;
                    [...thumbs.children].forEach(c => c.className = "w-16 h-16 rounded-lg object-cover cursor-pointer border-2 flex-shrink-0 transition border-transparent hover:border-emerald-300");
                    img.className = "w-16 h-16 rounded-lg object-cover cursor-pointer border-2 flex-shrink-0 transition border-emerald-500";
                };
                thumbs.appendChild(img);
            });
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeGallery(event) {
            if (event && event.target.id !== 'galleryModal') return;
            const modal = document.getElementById('galleryModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeGallery();
        });

        filterProducts();
        loadCounts();
    </script>
