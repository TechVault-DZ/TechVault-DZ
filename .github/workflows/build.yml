name: Build TechVault DZ APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache
          pip install --upgrade pip
          pip install --upgrade buildozer "cython<3.0" virtualenv

      - name: Verify project files
        run: |
          echo "=== Files in repo ==="
          ls -la
          echo "=== Checking critical files ==="
          for f in app.py buildozer.spec index.html logo.png arabic.ttf; do
            if [ -f "$f" ]; then
              echo "OK: $f ($(stat -c%s "$f") bytes)"
            else
              echo "MISSING: $f"
            fi
          done

      - name: Cache Buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Cache Buildozer local
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-local-

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          buildozer -v android debug 2>&1 | tee build_output.log

      - name: Show last 100 lines of build output
        if: always()
        run: |
          echo "=== LAST 100 LINES ==="
          tail -100 build_output.log || echo "No build_output.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TechVaultDZ-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            build_output.log
            .buildozer/**/*.log
          if-no-files-found: warn
